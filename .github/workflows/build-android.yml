name: Build and test Android app
on:
  workflow_dispatch:
    inputs:
      native_test_class:
        description: Optional native test class for a focused diagnostic run
        required: false
        default: ''
        type: string
  push:
    branches: [feat/android-usb]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DESKINK_NATIVE_TEST_CLASS: ${{ inputs.native_test_class }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit and native-input tests
        if: inputs.native_test_class == ''
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android video and input integration
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-android-emulator.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: DeskInk-Android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/
            android/core/build/reports/
            artifacts/local/android-cloud/
          retention-days: 3
