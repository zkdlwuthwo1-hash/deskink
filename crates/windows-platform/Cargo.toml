[package]
name = "deskink-windows"
version.workspace = true
edition.workspace = true

[target.'cfg(windows)'.dependencies]
deskink-core = { path = "../ink-core" }
tiny-skia = "0.12"
windows = { version = "0.58", features = [
    "implement", "Foundation_Collections", "Graphics_Capture",
    "Graphics_DirectX_Direct3D11", "UI", "Win32_Foundation",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_HiDpi",
] }
